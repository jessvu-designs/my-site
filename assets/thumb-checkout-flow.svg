<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <!-- Background -->
  <rect width="400" height="160" fill="#f7f0f5"/>

  <!-- Step connector lines -->
  <line x1="90" y1="62" x2="160" y2="62" stroke="#e0c8da" stroke-width="2"/>
  <line x1="240" y1="62" x2="310" y2="62" stroke="#e0c8da" stroke-width="2"/>

  <!-- Step 1: Cart (active) -->
  <circle cx="62" cy="62" r="22" fill="#B5177E"/>
  <!-- Cart icon -->
  <path d="M54 55 h3 l4 14 h10 l3-10 H57" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62" cy="71" r="1.5" fill="#fff"/>
  <circle cx="68" cy="71" r="1.5" fill="#fff"/>
  <text x="62" y="94" font-family="sans-serif" font-size="9" fill="#B5177E" text-anchor="middle" font-weight="700">Cart</text>

  <!-- Step 2: Shipping (active) -->
  <circle cx="200" cy="62" r="22" fill="#B5177E"/>
  <!-- Location pin icon -->
  <path d="M200 52 a8 8 0 0 1 0 16 a8 8 0 0 1 0-16" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="200" cy="60" r="2.5" fill="#fff"/>
  <path d="M200 68 L200 74" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="200" y="94" font-family="sans-serif" font-size="9" fill="#B5177E" text-anchor="middle" font-weight="700">Shipping</text>

  <!-- Step 3: Payment (inactive) -->
  <circle cx="338" cy="62" r="22" fill="#e8d5e3"/>
  <!-- Card icon -->
  <rect x="328" y="55" width="20" height="14" rx="2" fill="none" stroke="#B5177E" stroke-width="2"/>
  <line x1="328" y1="60" x2="348" y2="60" stroke="#B5177E" stroke-width="2"/>
  <rect x="331" y="63" width="6" height="3" rx="1" fill="#B5177E"/>
  <text x="338" y="94" font-family="sans-serif" font-size="9" fill="#999" text-anchor="middle">Payment</text>

  <!-- Progress label -->
  <rect x="150" y="108" width="100" height="20" rx="10" fill="#B5177E"/>
  <text x="200" y="122" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">Step 2 of 3</text>

  <!-- Label -->
  <text x="200" y="150" font-family="sans-serif" font-size="10" fill="#B5177E" text-anchor="middle" font-weight="600" letter-spacing="0.5">Checkout Flow Optimization</text>
</svg>