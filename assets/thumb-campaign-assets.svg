<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <!-- Background -->
  <rect width="400" height="160" fill="#f7f0f5"/>

  <!-- Large hero card -->
  <rect x="20" y="16" width="110" height="90" rx="6" fill="#B5177E"/>
  <rect x="30" y="26" width="70" height="40" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="30" y="72" width="50" height="5" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="30" y="80" width="35" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="30" y="88" width="55" height="8" rx="3" fill="rgba(255,255,255,0.25)"/>

  <!-- Square card -->
  <rect x="142" y="16" width="68" height="68" rx="6" fill="#e91e8c"/>
  <circle cx="176" cy="40" r="14" fill="rgba(255,255,255,0.2)"/>
  <rect x="154" y="60" width="44" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="160" y="67" width="32" height="3" rx="2" fill="rgba(255,255,255,0.35)"/>

  <!-- Story/portrait card -->
  <rect x="222" y="16" width="52" height="90" rx="6" fill="#d4145a"/>
  <rect x="230" y="24" width="36" height="50" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="230" y="78" width="28" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="230" y="85" width="20" height="3" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Banner card -->
  <rect x="286" y="16" width="94" height="36" rx="6" fill="#1a1a1a"/>
  <rect x="294" y="22" width="40" height="24" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="340" y="24" width="32" height="5" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="340" y="32" width="22" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>

  <!-- Small tile -->
  <rect x="286" y="60" width="44" height="46" rx="6" fill="#e91e8c" opacity="0.7"/>
  <rect x="294" y="68" width="28" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="294" y="92" width="20" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>

  <!-- Mini tile -->
  <rect x="338" y="60" width="42" height="46" rx="6" fill="#B5177E" opacity="0.6"/>
  <rect x="345" y="68" width="28" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="345" y="92" width="20" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>

  <!-- Bottom row: color swatches -->
  <rect x="20" y="118" width="20" height="12" rx="3" fill="#B5177E"/>
  <rect x="44" y="118" width="20" height="12" rx="3" fill="#e91e8c"/>
  <rect x="68" y="118" width="20" height="12" rx="3" fill="#d4145a"/>
  <rect x="92" y="118" width="20" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="116" y="118" width="20" height="12" rx="3" fill="#f0e0eb"/>

  <!-- Label -->
  <text x="280" y="129" font-family="sans-serif" font-size="10" fill="#B5177E" text-anchor="middle" font-weight="600" letter-spacing="0.5">Campaign Assets</text>
</svg>